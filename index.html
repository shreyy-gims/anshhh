<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Anshhh</title>

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Inter, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* =====================================================
       BACKGROUND VIDEO
    ===================================================== */

    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.42);
      z-index: -3;
    }

    /* DARK OVERLAY */

    body::after {
      content: "";
      position: fixed;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.4),
          rgba(0, 0, 0, 0.62)
        );

      pointer-events: none;

      z-index: -2;
    }

    /* =====================================================
       ENTER SCREEN
    ===================================================== */

    #overlay {
      position: fixed;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: #000;

      z-index: 100;

      cursor: pointer;

      transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
    }

    #overlay h1 {
      font-family: Orbitron, sans-serif;

      font-size: 30px;

      letter-spacing: 4px;

      margin-bottom: 10px;
    }

    #overlay p {
      opacity: 0.55;

      font-size: 12px;

      letter-spacing: 3px;

      text-transform: uppercase;

      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 1;
      }
    }

    /* =====================================================
       MAIN CONTAINER
    ===================================================== */

    .container {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 92%;

      max-width: 390px;

      padding: 18px;

      border-radius: 28px;

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      background: rgba(18, 18, 20, 0.3);

      border: 1px solid rgba(255, 255, 255, 0.08);

      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.03),
        0 20px 80px rgba(0, 0, 0, 0.7);

      z-index: 2;
    }

    /* =====================================================
       PROFILE + DKAOS CARD
    ===================================================== */

    .card,
    .server {
      display: flex;

      gap: 14px;

      align-items: center;

      padding: 14px;

      border-radius: 20px;

      background: rgba(255, 255, 255, 0.045);

      border: 1px solid rgba(255, 255, 255, 0.07);

      margin-bottom: 14px;

      transition:
        transform 0.35s ease,
        background 0.35s ease,
        border-color 0.35s ease;
    }

    .server {
      margin-bottom: 0;
    }

    .card:hover,
    .server:hover {
      transform: translateY(-2px);

      background: rgba(255, 255, 255, 0.06);

      border-color: rgba(255, 255, 255, 0.12);
    }

    /* =====================================================
       PROFILE
    ===================================================== */

    .avatar {
      width: 62px;
      height: 62px;

      flex-shrink: 0;

      border-radius: 50%;

      object-fit: cover;

      border: 2px solid rgba(255, 255, 255, 0.12);
    }

    /* =====================================================
       TEXT
    ===================================================== */

    .title {
      font-family: Orbitron, sans-serif;

      font-size: 18px;

      color: #fff;

      letter-spacing: 1px;
    }

    .sub {
      opacity: 0.65;

      font-size: 12px;

      margin-top: 3px;
    }

    .loc {
      opacity: 0.45;

      font-size: 11px;

      margin-top: 4px;
    }

    /* =====================================================
       SOCIAL LINKS
    ===================================================== */

    .links {
      display: flex;

      gap: 14px;

      margin-top: 10px;

      flex-wrap: wrap;
    }

    .links a {
      display: flex;

      align-items: center;

      gap: 6px;

      text-decoration: none;

      color: #fff;

      font-size: 12px;

      opacity: 0.75;

      transition:
        opacity 0.3s,
        transform 0.3s;
    }

    .links a:hover {
      opacity: 1;

      transform: translateY(-2px);
    }

    .links img {
      width: 16px;
      height: 16px;

      object-fit: contain;
    }

    /* =====================================================
       DKAOS
    ===================================================== */

    .server img {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      border-radius: 12px;

      object-fit: cover;
    }

    .server-info {
      flex: 1;

      min-width: 0;
    }

    .dkaos-title {
      font-size: 14px;
    }

    /* =====================================================
       VISIT BUTTON
    ===================================================== */

    .join {
      position: relative;

      overflow: hidden;

      flex-shrink: 0;

      padding: 10px 18px;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #111,
          #1f1f1f
        );

      border: 1px solid rgba(255, 255, 255, 0.12);

      color: #fff;

      text-decoration: none;

      font-size: 12px;

      font-weight: 600;

      letter-spacing: 0.5px;

      transition: 0.35s ease;

      box-shadow:
        0 0 0 rgba(255, 255, 255, 0),
        0 8px 30px rgba(255, 255, 255, 0.05);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .join::before {
      content: "";

      position: absolute;

      top: -120%;
      left: -40%;

      width: 60%;
      height: 300%;

      background:
        linear-gradient(
          120deg,
          transparent,
          rgba(255, 255, 255, 0.35),
          transparent
        );

      transform: rotate(25deg);

      transition: 0.7s;
    }

    .join::after {
      content: "";

      position: absolute;

      inset: 0;

      border-radius: 16px;

      padding: 1px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.4),
          rgba(255, 255, 255, 0.05),
          rgba(255, 255, 255, 0.25)
        );

      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

      -webkit-mask-composite: xor;

      mask-composite: exclude;

      pointer-events: none;

      opacity: 0.6;

      transition: 0.4s;
    }

    .join:hover {
      transform:
        translateY(-3px)
        scale(1.03);

      background:
        linear-gradient(
          135deg,
          #161616,
          #242424
        );

      box-shadow:
        0 0 20px rgba(255, 255, 255, 0.12),
        0 10px 40px rgba(255, 255, 255, 0.08);
    }

    .join:hover::before {
      left: 140%;
    }

    .join:hover::after {
      opacity: 1;
    }

    .join:active {
      transform: scale(0.96);
    }

    /* =====================================================
       CURSOR GLOW
    ===================================================== */

    .glow {
      position: fixed;

      width: 320px;
      height: 320px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.1) 0%,
          rgba(255, 255, 255, 0.04) 30%,
          transparent 70%
        );

      filter: blur(40px);

      pointer-events: none;

      z-index: 0;

      transition:
        left 0.08s linear,
        top 0.08s linear;

      mix-blend-mode: screen;
    }

    /* =====================================================
       PARTICLES
    ===================================================== */

    canvas {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 1;
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 480px) {

      .container {
        width: calc(100% - 28px);

        padding: 13px;

        border-radius: 24px;
      }

      .card,
      .server {
        padding: 13px;

        border-radius: 18px;
      }

      .avatar {
        width: 58px;
        height: 58px;
      }

      .title {
        font-size: 16px;
      }

      .sub {
        font-size: 11px;
      }

      .links {
        gap: 10px;
      }

      .links a {
        font-size: 11px;
      }

      .server img {
        width: 40px;
        height: 40px;
      }

      .join {
        padding: 9px 14px;

        font-size: 11px;
      }

      #overlay h1 {
        font-size: 26px;
      }

    }

  </style>
</head>

<body>

  <!-- =====================================================
       ENTER SCREEN
  ====================================================== -->

  <div id="overlay">

    <h1>ANSHHH</h1>

    <p>tap to enter</p>

  </div>


  <!-- =====================================================
       BACKGROUND VIDEO
  ====================================================== -->

  <video
    id="bg"
    autoplay
    muted
    loop
    playsinline
  >

    <source
      src="video.mp4"
      type="video/mp4"
    />

  </video>


  <!-- =====================================================
       BACKGROUND MUSIC
  ====================================================== -->

  <audio
    id="music"
    loop
    preload="auto"
  >

    <source
      src="song.mp3"
      type="audio/mpeg"
    />

  </audio>


  <!-- =====================================================
       MAIN PROFILE
  ====================================================== -->

  <div class="container">

    <!-- PROFILE -->

    <div class="card">

      <img
        src="profile.jpeg"
        class="avatar"
        alt="Anshh"
      />

      <div>

        <div class="title">
          Anshh
        </div>

        <div class="sub">
          Developer · Founder (OxBridge)
        </div>

        <div class="loc">
          📍 Bhilai
        </div>


        <!-- SOCIAL LINKS -->

        <div class="links">

          <!-- INSTAGRAM -->

          <a
            href="https://www.instagram.com/anshhhyrrrr?igsh=dmg1ZzZtMWxkeGow"
            target="_blank"
            rel="noopener noreferrer"
          >

            <img
              src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png"
              alt=""
            />

            Insta

          </a>


          <!-- GITHUB -->

          <a
            href="https://github.com/shreyy-gims"
            target="_blank"
            rel="noopener noreferrer"
          >

            <img
              src="https://cdn-icons-png.flaticon.com/512/733/733553.png"
              alt=""
            />

            GitHub

          </a>


          <!-- SPOTIFY -->

          <a
            href="https://open.spotify.com/user/317fetkkltqoeycuqqxt5tlsx4wu?si=BksPV-J8QECOL4-LcfS-WQ"
            target="_blank"
            rel="noopener noreferrer"
          >

            <img
              src="https://cdn-icons-png.flaticon.com/512/174/174872.png"
              alt=""
            />

            Spotify

          </a>

        </div>

      </div>

    </div>


    <!-- ===================================================
         DKAOS
    ==================================================== -->

    <div class="server">

      <!--
        Keep your existing server.png,
        or replace it with your DKAOS logo.
      -->

      <img
        src="kaosbg.jpeg"
        alt="DKAOS"
      />


      <div class="server-info">

        <div class="title dkaos-title">
          DKAOS
        </div>

        <div class="sub">
          Culture × Crowd × Kaos
        </div>

      </div>


      <a
        class="join"
        href="link here"
        target="_blank"
        rel="noopener noreferrer"
      >
        Visit
      </a>

    </div>

  </div>


  <!-- =====================================================
       CURSOR GLOW
  ====================================================== -->

  <div
    class="glow"
    id="glow"
  ></div>


  <!-- =====================================================
       PARTICLES
  ====================================================== -->

  <canvas id="c"></canvas>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    const overlay =
      document.getElementById('overlay');

    const music =
      document.getElementById('music');

    const video =
      document.getElementById('bg');

    const glow =
      document.getElementById('glow');


    /* =====================================================
       ENTER
    ====================================================== */

    overlay.onclick = async () => {

      /*
       * Fade out entrance screen
       */

      overlay.style.opacity = '0';


      setTimeout(() => {

        overlay.style.display = 'none';

      }, 500);


      /*
       * Start background video
       */

      try {

        await video.play();

      } catch (error) {

        console.log(
          'Video playback failed:',
          error
        );

      }


      /*
       * Start background music
       *
       * Because the user tapped the screen,
       * browsers normally allow audio playback here.
       */

      try {

        music.volume = 0.6;

        await music.play();

      } catch (error) {

        console.log(
          'Audio playback failed:',
          error
        );

      }


      /*
       * Animate profile into view
       */

      gsap.from(
        '.container',
        {
          opacity: 0,
          y: 40,
          scale: 0.97,
          duration: 1,
          ease: 'power3.out'
        }
      );

    };


    /* =====================================================
       CURSOR GLOW
    ====================================================== */

    window.addEventListener(
      'mousemove',
      (event) => {

        glow.style.left =
          event.clientX - 160 + 'px';

        glow.style.top =
          event.clientY - 160 + 'px';

      }
    );


    window.addEventListener(
      'touchmove',
      (event) => {

        const touch =
          event.touches[0];

        if (!touch) {
          return;
        }

        glow.style.left =
          touch.clientX - 160 + 'px';

        glow.style.top =
          touch.clientY - 160 + 'px';

      },
      {
        passive: true
      }
    );


    /* =====================================================
       PARTICLES
    ====================================================== */

    const canvas =
      document.getElementById('c');

    const ctx =
      canvas.getContext('2d');


    function resizeCanvas() {

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;

    }


    resizeCanvas();


    window.addEventListener(
      'resize',
      resizeCanvas
    );


    const particles = [];


    function createParticle(x, y) {

      particles.push({

        x,
        y,

        life: 40,

        size:
          Math.random() * 1.4 + 0.4

      });

    }


    /* Desktop particles */

    window.addEventListener(
      'mousemove',
      (event) => {

        createParticle(
          event.clientX,
          event.clientY
        );

      }
    );


    /* Mobile particles */

    window.addEventListener(
      'touchmove',
      (event) => {

        const touch =
          event.touches[0];

        if (!touch) {
          return;
        }

        createParticle(
          touch.clientX,
          touch.clientY
        );

      },
      {
        passive: true
      }
    );


    /* =====================================================
       PARTICLE RENDER LOOP
    ====================================================== */

    function drawParticles() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      for (
        let i = particles.length - 1;
        i >= 0;
        i--
      ) {

        const particle =
          particles[i];


        const opacity =
          particle.life / 40;


        ctx.fillStyle =
          `rgba(255,255,255,${opacity})`;


        ctx.beginPath();


        ctx.arc(
          particle.x,
          particle.y,
          particle.size,
          0,
          Math.PI * 2
        );


        ctx.fill();


        particle.life--;


        if (particle.life <= 0) {

          particles.splice(
            i,
            1
          );

        }

      }


      requestAnimationFrame(
        drawParticles
      );

    }


    drawParticles();

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <meta
    name="description"
    content="Personal website of Anshh — Developer & Founder."
  />

  <title>Anshhh</title>

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #000;
      color: #fff;

      font-family: Inter, sans-serif;

      overflow: hidden;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a,
    button {
      -webkit-tap-highlight-color: transparent;
    }


    /* =====================================================
       BACKGROUND VIDEO
    ===================================================== */

    #bg {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      filter:
        brightness(0.42)
        grayscale(0.18);

      transform: scale(1.015);

      z-index: -4;
    }


    /* =====================================================
       BACKGROUND OVERLAYS
    ===================================================== */

    .background-overlay {
      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255, 255, 255, 0.015),
          transparent 45%
        ),
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.28),
          rgba(0, 0, 0, 0.72)
        );

      z-index: -3;
    }

    .vignette {
      position: fixed;
      inset: 0;

      pointer-events: none;

      box-shadow:
        inset 0 0 180px rgba(0, 0, 0, 0.65);

      z-index: -2;
    }


    /* =====================================================
       ENTER SCREEN
    ===================================================== */

    #overlay {
      position: fixed;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: #000;

      z-index: 100;

      cursor: pointer;

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;
    }

    #overlay h1 {
      font-family: Orbitron, sans-serif;

      font-size: 30px;
      font-weight: 600;

      letter-spacing: 5px;

      margin-left: 5px;

      color: #fff;
    }

    #overlay p {
      margin-top: 12px;

      color: rgba(255, 255, 255, 0.38);

      font-size: 9px;
      font-weight: 500;

      letter-spacing: 4px;

      text-transform: uppercase;

      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.25;
      }

      50% {
        opacity: 0.8;
      }
    }


    /* =====================================================
       PAGE
    ===================================================== */

    .page {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      z-index: 3;
    }


    /* =====================================================
       PROFILE WRAPPER
    ===================================================== */

    .container {
      width: 100%;
      max-width: 420px;

      opacity: 1;
    }


    /* =====================================================
       PROFILE CARD
    ===================================================== */

    .card {
      position: relative;

      display: flex;
      align-items: center;

      gap: 17px;

      width: 100%;

      padding: 19px;

      border-radius: 25px;

      background:
        linear-gradient(
          135deg,
          rgba(20, 20, 20, 0.52),
          rgba(8, 8, 8, 0.36)
        );

      border: 1px solid rgba(255, 255, 255, 0.085);

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);

      overflow: hidden;

      transition:
        transform 0.45s cubic-bezier(.2, .8, .2, 1),
        border-color 0.4s ease,
        background 0.4s ease;
    }

    .card::before {
      content: "";

      position: absolute;

      top: 0;
      left: -80%;

      width: 50%;
      height: 100%;

      background:
        linear-gradient(
          110deg,
          transparent,
          rgba(255, 255, 255, 0.025),
          transparent
        );

      transform: skewX(-15deg);

      transition: left 0.9s ease;

      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-4px);

      border-color: rgba(255, 255, 255, 0.14);

      background:
        linear-gradient(
          135deg,
          rgba(24, 24, 24, 0.57),
          rgba(10, 10, 10, 0.42)
        );
    }

    .card:hover::before {
      left: 130%;
    }


    /* =====================================================
       AVATAR
    ===================================================== */

    .avatar-wrap {
      position: relative;

      width: 68px;
      height: 68px;

      flex-shrink: 0;
    }

    .avatar {
      width: 100%;
      height: 100%;

      border-radius: 50%;

      object-fit: cover;

      border: 1px solid rgba(255, 255, 255, 0.16);

      filter: grayscale(0.08);

      transition:
        transform 0.45s cubic-bezier(.2, .8, .2, 1),
        border-color 0.35s ease;
    }

    .card:hover .avatar {
      transform: scale(1.025);

      border-color: rgba(255, 255, 255, 0.28);
    }

    .status {
      position: absolute;

      right: 2px;
      bottom: 3px;

      width: 11px;
      height: 11px;

      border-radius: 50%;

      background: #fff;

      border: 3px solid #101010;

      opacity: 0.85;
    }


    /* =====================================================
       PROFILE CONTENT
    ===================================================== */

    .profile-content {
      flex: 1;

      min-width: 0;
    }

    .name-row {
      display: flex;
      align-items: center;

      gap: 7px;
    }

    .title {
      font-family: Orbitron, sans-serif;

      color: #fff;

      font-size: 18px;
      font-weight: 600;

      letter-spacing: 0.6px;
    }

    .dot {
      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.35);
    }

    .sub {
      margin-top: 5px;

      color: rgba(255, 255, 255, 0.55);

      font-size: 11px;
      font-weight: 500;

      letter-spacing: 0.01em;
    }

    .loc {
      margin-top: 5px;

      color: rgba(255, 255, 255, 0.3);

      font-size: 10px;
      font-weight: 400;

      letter-spacing: 0.02em;
    }


    /* =====================================================
       SOCIAL LINKS
    ===================================================== */

    .links {
      display: flex;
      align-items: center;

      gap: 7px;

      margin-top: 14px;

      flex-wrap: wrap;
    }

    .links a {
      position: relative;

      display: inline-flex;
      align-items: center;

      gap: 6px;

      padding: 7px 10px;

      border-radius: 999px;

      border: 1px solid rgba(255, 255, 255, 0.075);

      background: rgba(255, 255, 255, 0.025);

      color: rgba(255, 255, 255, 0.55);

      text-decoration: none;

      font-size: 9px;
      font-weight: 500;

      white-space: nowrap;

      overflow: hidden;

      transition:
        color 0.3s ease,
        background 0.3s ease,
        border-color 0.3s ease,
        transform 0.3s cubic-bezier(.2, .8, .2, 1);
    }

    .links a::before {
      content: "";

      position: absolute;
      inset: 0;

      background: rgba(255, 255, 255, 0.055);

      transform: translateY(105%);

      transition:
        transform 0.35s cubic-bezier(.2, .8, .2, 1);
    }

    .links a:hover {
      color: #fff;

      border-color: rgba(255, 255, 255, 0.18);

      transform: translateY(-2px);
    }

    .links a:hover::before {
      transform: translateY(0);
    }

    .links a:active {
      transform: scale(0.96);
    }

    .links svg {
      position: relative;

      z-index: 2;

      width: 13px;
      height: 13px;

      flex-shrink: 0;

      transition:
        transform 0.35s cubic-bezier(.2, .8, .2, 1);
    }

    .links span {
      position: relative;

      z-index: 2;
    }

    .links a:hover svg {
      transform:
        translateY(-1px)
        scale(1.08);
    }


    /* =====================================================
       SMALL SIGNATURE
    ===================================================== */

    .signature {
      margin-top: 13px;

      text-align: center;

      color: rgba(255, 255, 255, 0.18);

      font-size: 8px;
      font-weight: 500;

      letter-spacing: 0.24em;

      text-transform: uppercase;

      user-select: none;
    }


    /* =====================================================
       CURSOR GLOW
    ===================================================== */

    .glow {
      position: fixed;

      width: 320px;
      height: 320px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.08) 0%,
          rgba(255, 255, 255, 0.025) 35%,
          transparent 70%
        );

      filter: blur(42px);

      pointer-events: none;

      z-index: 0;

      opacity: 0;

      transform: translate3d(-1000px, -1000px, 0);

      transition: opacity 0.5s ease;

      mix-blend-mode: screen;
    }


    /* =====================================================
       PARTICLES
    ===================================================== */

    #c {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 2;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 480px) {
      .page {
        padding: 14px;
      }

      .container {
        max-width: 390px;
      }

      .card {
        gap: 14px;

        padding: 16px;

        border-radius: 22px;
      }

      .avatar-wrap {
        width: 61px;
        height: 61px;
      }

      .title {
        font-size: 16px;
      }

      .sub {
        font-size: 10px;
      }

      .loc {
        font-size: 9px;
      }

      .links {
        gap: 6px;

        margin-top: 12px;
      }

      .links a {
        gap: 5px;

        padding: 7px 9px;

        font-size: 8.5px;
      }

      .links svg {
        width: 12px;
        height: 12px;
      }

      #overlay h1 {
        font-size: 25px;

        letter-spacing: 4px;
      }

      #overlay p {
        font-size: 8px;
      }
    }


    /* =====================================================
       VERY SMALL PHONES
    ===================================================== */

    @media (max-width: 350px) {
      .card {
        align-items: flex-start;

        padding: 14px;
      }

      .avatar-wrap {
        width: 54px;
        height: 54px;
      }

      .links a {
        padding: 6px 8px;
      }
    }


    /* =====================================================
       REDUCED MOTION
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    /* =====================================================
       ELEMENTS
    ====================================================== */

    const overlay =
      document.getElementById('overlay');

    const music =
      document.getElementById('music');

    const video =
      document.getElementById('bg');

    const glow =
      document.getElementById('glow');

    const card =
      document.querySelector('.card');


    /* =====================================================
       ENTER
    ====================================================== */

    overlay.addEventListener(
      'click',
      async () => {

        /*
         * Hide entrance
         */

        overlay.style.opacity = '0';
        overlay.style.visibility = 'hidden';


        setTimeout(() => {

          overlay.style.display = 'none';

        }, 600);


        /*
         * Background video
         */

        try {

          await video.play();

        } catch (error) {

          console.log(
            'Video playback failed:',
            error
          );

        }


        /*
         * Music
         */

        try {

          music.volume = 0.6;

          await music.play();

        } catch (error) {

          console.log(
            'Audio playback failed:',
            error
          );

        }


        /*
         * Profile entrance
         */

        gsap.fromTo(
          '.container',

          {
            opacity: 0,
            y: 32,
            scale: 0.965
          },

          {
            opacity: 1,
            y: 0,
            scale: 1,

            duration: 1.05,

            ease: 'power3.out'
          }
        );


        /*
         * Avatar
         */

        gsap.fromTo(
          '.avatar-wrap',

          {
            opacity: 0,
            scale: 0.85
          },

          {
            opacity: 1,
            scale: 1,

            duration: 0.8,
            delay: 0.18,

            ease: 'back.out(1.7)'
          }
        );


        /*
         * Text
         */

        gsap.fromTo(
          [
            '.title',
            '.sub',
            '.loc'
          ],

          {
            opacity: 0,
            y: 10
          },

          {
            opacity: 1,
            y: 0,

            stagger: 0.08,

            duration: 0.65,
            delay: 0.25,

            ease: 'power2.out'
          }
        );


        /*
         * Social buttons
         */

        gsap.fromTo(
          '.links a',

          {
            opacity: 0,
            y: 10
          },

          {
            opacity: 1,
            y: 0,

            stagger: 0.09,

            duration: 0.55,
            delay: 0.45,

            ease: 'power2.out'
          }
        );


        /*
         * Signature
         */

        gsap.fromTo(
          '.signature',

          {
            opacity: 0
          },

          {
            opacity: 1,

            duration: 1,
            delay: 0.8
          }
        );

      }
    );


    /* =====================================================
       CURSOR GLOW
    ====================================================== */

    let glowVisible = false;


    window.addEventListener(
      'mousemove',
      (event) => {

        if (!glowVisible) {

          glow.style.opacity = '1';

          glowVisible = true;

        }


        glow.style.transform =
          `translate3d(
            ${event.clientX - 160}px,
            ${event.clientY - 160}px,
            0
          )`;

      }
    );


    window.addEventListener(
      'mouseleave',
      () => {

        glow.style.opacity = '0';

        glowVisible = false;

      }
    );


    /* =====================================================
       SUBTLE CARD TILT
    ====================================================== */

    if (
      card &&
      window.matchMedia('(pointer: fine)').matches
    ) {

      card.addEventListener(
        'mousemove',
        (event) => {

          const rect =
            card.getBoundingClientRect();


          const x =
            event.clientX - rect.left;

          const y =
            event.clientY - rect.top;


          const centerX =
            rect.width / 2;

          const centerY =
            rect.height / 2;


          const rotateX =
            ((y - centerY) / centerY) * -1.5;

          const rotateY =
            ((x - centerX) / centerX) * 1.5;


          card.style.transform =
            `perspective(900px)
             translateY(-4px)
             rotateX(${rotateX}deg)
             rotateY(${rotateY}deg)`;

        }
      );


      card.addEventListener(
        'mouseleave',
        () => {

          card.style.transform =
            'perspective(900px) translateY(0) rotateX(0) rotateY(0)';

        }
      );

    }


    /* =====================================================
       CANVAS
    ====================================================== */

    const canvas =
      document.getElementById('c');

    const ctx =
      canvas.getContext('2d');


    function resizeCanvas() {

      const ratio =
        Math.min(
          window.devicePixelRatio || 1,
          2
        );


      canvas.width =
        window.innerWidth * ratio;

      canvas.height =
        window.innerHeight * ratio;


      canvas.style.width =
        window.innerWidth + 'px';

      canvas.style.height =
        window.innerHeight + 'px';


      ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );

    }


    resizeCanvas();


    window.addEventListener(
      'resize',
      resizeCanvas
    );


    /* =====================================================
       PARTICLES
    ====================================================== */

    const particles = [];


    function createParticle(
      x,
      y
    ) {

      /*
       * Limit particle count so the effect stays smooth
       * on phones.
       */

      if (particles.length > 80) {

        particles.shift();

      }


      particles.push({

        x,
        y,

        life: 34,

        size:
          Math.random() * 1.15 + 0.3,

        vx:
          (Math.random() - 0.5) * 0.18,

        vy:
          (Math.random() - 0.5) * 0.18

      });

    }


    /* =====================================================
       DESKTOP PARTICLES
    ====================================================== */

    let lastParticleTime = 0;


    window.addEventListener(
      'mousemove',
      (event) => {

        const now =
          performance.now();


        if (
          now - lastParticleTime < 18
        ) {

          return;

        }


        lastParticleTime = now;


        createParticle(
          event.clientX,
          event.clientY
        );

      }
    );


    /* =====================================================
       MOBILE PARTICLES
    ====================================================== */

    window.addEventListener(
      'touchmove',
      (event) => {

        const touch =
          event.touches[0];


        if (!touch) {

          return;

        }


        createParticle(
          touch.clientX,
          touch.clientY
        );

      },

      {
        passive: true
      }
    );


    /* =====================================================
       PARTICLE RENDER LOOP
    ====================================================== */

    function drawParticles() {

      ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
      );


      for (
        let i = particles.length - 1;
        i >= 0;
        i--
      ) {

        const particle =
          particles[i];


        const opacity =
          particle.life / 34;


        ctx.fillStyle =
          `rgba(
            255,
            255,
            255,
            ${opacity * 0.75}
          )`;


        ctx.beginPath();


        ctx.arc(
          particle.x,
          particle.y,
          particle.size,
          0,
          Math.PI * 2
        );


        ctx.fill();


        particle.x +=
          particle.vx;

        particle.y +=
          particle.vy;

        particle.life--;


        if (
          particle.life <= 0
        ) {

          particles.splice(
            i,
            1
          );

        }

      }


      requestAnimationFrame(
        drawParticles
      );

    }


    drawParticles();

  </script>

</body>
</html>
